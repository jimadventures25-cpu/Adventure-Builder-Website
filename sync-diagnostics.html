<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adventure Builder Sync Diagnostics V1</title>
<style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f4ef;color:#14191b}.wrap{max-width:820px;margin:0 auto;padding:28px 18px 48px}.brand{font-weight:900;font-size:1.05rem;color:#e86f12;letter-spacing:.04em}.panel{margin-top:18px;background:white;border:1px solid #dfe3e2;border-radius:18px;padding:20px;box-shadow:0 8px 28px rgba(0,0,0,.06)}h1{font-size:clamp(1.8rem,5vw,2.6rem);margin:.35rem 0}.note{color:#596164;line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}#run-diag{background:#f47b20;color:#111}#copy-diag{background:#182126;color:white}.row{display:grid;grid-template-columns:minmax(180px,.9fr) minmax(0,1.4fr);gap:14px;padding:11px 0;border-bottom:1px solid #eceeed}.row b{font-size:.92rem}.row span{overflow-wrap:anywhere}.row.ok span{color:#137333;font-weight:750}.row.bad span{color:#b3261e;font-weight:800}.row.warn span{color:#8a5a00;font-weight:750}#diag-status{font-size:.92rem;color:#596164;margin-top:14px}@media(max-width:580px){.row{grid-template-columns:1fr;gap:4px}}</style></head><body><main class="wrap"><div class="brand">ADVENTURE BUILDER · READ-ONLY TOOL</div><h1>Website ↔ App Sync Diagnostics V1</h1><p class="note">Checks this device's saved Trip Planner data, current Adventure Builder login session, and your own rows in Supabase <code>adventure_plans</code>. It does not create, update or delete anything.</p><div class="actions"><button id="run-diag">Run diagnostics</button><button id="copy-diag">Copy report</button></div><section class="panel" id="diag-output" aria-live="polite"></section><p id="diag-status">Starting…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/sync-diagnostics-v1.js"></script></body></html>
